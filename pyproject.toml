[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".ruff_cache",
    "data",
    "models",
    "logs",
]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
